    <style>

        .container {
            width: 700px;

        }

        ul.activity-list {
            list-style-type: none;
        }

        ul.activity-list li {
            margin-bottom: 10px;
        }

        ul.activity-list a {
            display: block;
            text-decoration: none;
            color: #1a5276;
            background-color: #ebf5fb;
            padding: 12px 16px;
            border-radius: 4px;
            border-left: 4px solid #2980b9;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s, color 0.2s;
        }

        ul.activity-list a:hover {
            background-color: #d4e6f1;
            color: #154360;
        }

        footer {
            margin-top: 30px;
            padding-top: 15px;
